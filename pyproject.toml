[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ceec-data-explorer"
version = "0.1.0"
description = "大考中心公開統計資料的可重跑 ETL"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.9,<3",
  "requests>=2.32,<3",
  "xlrd>=2.0.1,<3",
]

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8,<10", "types-requests>=2.32,<3"]

[project.scripts]
ceec-etl = "ceec_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ceec_etl = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
packages = ["ceec_etl"]
